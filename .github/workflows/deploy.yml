name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Adjust if your bucket is in a different region

      - name: Deploy to S3 (Root)
        run: aws s3 sync public/ s3://unicorntaxidermy.com --delete --acl public-read

      - name: Deploy to S3 (WWW)
        run: aws s3 sync public/ s3://www.unicorntaxidermy.com --delete --acl public-read

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id EJC9X8NFGEKH9 --paths "/*"
